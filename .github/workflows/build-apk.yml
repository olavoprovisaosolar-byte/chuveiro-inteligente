name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp www/index.html www/style.css www/app.js www/mqtt.min.js android/app/src/main/assets/

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare release APK
        run: |
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/ChuveiroInteligente.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chuveiro-inteligente-apk
          path: downloads/ChuveiroInteligente.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Chuveiro Inteligente v1.0.${{ github.run_number }}
          body: |
            ## Downloads

            - **APK Android:** `ChuveiroInteligente.apk`
            - **App web:** abra `index.html` ou a [página de download](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/download.html)

            Instalação: no Android, permita instalar apps de fontes desconhecidas para o navegador/arquivos.
          files: downloads/ChuveiroInteligente.apk
          generate_release_notes: true
