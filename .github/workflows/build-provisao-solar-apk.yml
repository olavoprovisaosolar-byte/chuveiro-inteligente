name: Build Provisão Solar APK

on:
  push:
    branches:
      - cursor/provisao-solar-app-f794
      - master
      - main
    paths:
      - 'provisao-solar-app/**'
      - '.github/workflows/build-provisao-solar-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provisao-solar-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: provisao-solar-app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: provisao-solar-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Copy APK artifact
        run: |
          mkdir -p ../artifact
          cp android/app/build/outputs/apk/debug/app-debug.apk ../artifact/ProvisaoSolar.apk
          ls -lh ../artifact/ProvisaoSolar.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: provisao-solar-apk
          path: artifact/ProvisaoSolar.apk
          retention-days: 30
